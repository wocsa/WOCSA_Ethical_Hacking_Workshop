name: wocsa-ai-offensive

# Attacker tooling for the AI offensive workshop. The vulnerable targets
# (DVWA, Juice Shop, Metasploitable2) are NOT here anymore: they are served
# by the shared CyberRange lab (../CyberRange). Start CyberRange first, then:
#   docker compose up -d
services:
  kali-cai:
    image: neptune1212/kali-cai
    container_name: kali-cai
    privileged: true
    tty: true
    env_file: ".env"
    # Dual-homed like a VPN peer of the simulated company: DMZ leg to reach
    # the public targets, intranet leg to reach the internal servers.
    networks:
      cyberrange-dmz:
        ipv4_address: 10.5.10.30
      cyberrange-intranet:
        ipv4_address: 10.5.20.30

  metasploit-mcp:
    build:
      context: ./metasploit-mcp
    container_name: metasploit-mcp
    env_file: ".env"
    networks:
      cyberrange-dmz:
        ipv4_address: 10.5.10.31

networks:
  cyberrange-dmz:
    name: cyberrange-dmz
    external: true
  cyberrange-intranet:
    name: cyberrange-intranet
    external: true
