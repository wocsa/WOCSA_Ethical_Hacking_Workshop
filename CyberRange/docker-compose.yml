name: cyberrange

# WOCSA CyberRange - an enterprise-style lab environment used by several workshops.
#
# Three zones, like a real company network:
#   dmz      (10.5.10.0/24)  Internet-facing services, published on the host.
#   db-tier  (10.5.15.0/24)  Databases. Only reachable by their application.
#   intranet (10.5.20.0/24)  Internal services and user workstations. NO host ports:
#                            reachable only through the WireGuard VPN (wg-easy).
#
# Start everything:      cp .env.example .env  &&  docker compose up -d
# Start a single zone:   docker compose --profile dmz up -d
# Available profiles:    dmz, intranet, vpn

x-lsio-env: &lsio-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-webtop: &webtop
  build:
    context: ./workstations
  image: cyberrange-workstation:latest
  restart: unless-stopped
  shm_size: "1gb"
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Etc/UTC}

services:
  # ---------------- DMZ: public services ----------------
  corporate-site:
    image: nginx:alpine
    container_name: cyberrange-corporate-site
    profiles: ["dmz"]
    restart: unless-stopped
    volumes:
      - ./corporate-site:/usr/share/nginx/html:ro
    networks:
      dmz:
        ipv4_address: 10.5.10.10
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:80"

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: cyberrange-juice-shop
    profiles: ["dmz"]
    restart: unless-stopped
    networks:
      dmz:
        ipv4_address: 10.5.10.11
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"

  dvwa:
    # Tri-homed - THE pivot path of the range, and the only one:
    #   dmz      : public web front end (the way in)
    #   db-tier  : its own database (web -> DB compromise)
    #   intranet : misconfigured leg, lets a pwned DVWA pivot internally
    # No other DMZ service can reach the intranet.
    image: cytopia/dvwa:php-8.1
    container_name: cyberrange-dvwa
    profiles: ["dmz"]
    restart: unless-stopped
    depends_on:
      - dvwa-db
    environment:
      SECURITY_LEVEL: ${DVWA_SECURITY_LEVEL:-low}
      MYSQL_HOSTNAME: dvwa-db
      MYSQL_DATABASE: dvwa
      MYSQL_USERNAME: dvwa
      MYSQL_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
    networks:
      dmz:
        ipv4_address: 10.5.10.12
      db-tier:
        ipv4_address: 10.5.15.20
      intranet:
        ipv4_address: 10.5.20.20
    ports:
      - "${BIND_IP:-127.0.0.1}:8081:80"

  dvwa-db:
    image: mariadb:10.1
    container_name: cyberrange-dvwa-db
    profiles: ["dmz"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: ${DB_PASSWORD:-p@ssw0rd}
    volumes:
      - dvwa_db_data:/var/lib/mysql
    networks:
      db-tier:
        ipv4_address: 10.5.15.10

  mailpit:
    # The company mail gateway: SMTP in, mailbox web UI out.
    # DMZ-only. Intranet clients (workstations, dvwa) reach it at 10.5.10.13
    # via its published ports - Docker's published-port rules allow this
    # without a network leg, keeping the intranet reachable from the DMZ
    # through DVWA ONLY.
    image: axllent/mailpit
    container_name: cyberrange-mailpit
    profiles: ["dmz"]
    restart: unless-stopped
    networks:
      dmz:
        ipv4_address: 10.5.10.13
    ports:
      - "${BIND_IP:-127.0.0.1}:8025:8025"   # Web UI (read the inbox)
      - "${BIND_IP:-127.0.0.1}:1025:1025"   # SMTP (send mail to the company)

  # ---------------- Intranet: internal services ----------------
  intranet-wiki:
    image: lscr.io/linuxserver/dokuwiki:latest
    container_name: cyberrange-intranet-wiki
    profiles: ["intranet"]
    restart: unless-stopped
    environment:
      <<: *lsio-env
    volumes:
      - intranet_wiki_config:/config
    networks:
      intranet:
        ipv4_address: 10.5.20.10

  fileserver:
    # Internal file server: SFTP/WebDAV/FTP + web client.
    # First start: open /web/admin to create the admin account.
    image: drakkan/sftpgo:latest
    container_name: cyberrange-fileserver
    profiles: ["intranet"]
    restart: unless-stopped
    environment:
      SFTPGO_GRACE_TIME: "20"
    volumes:
      - fileserver_data:/srv/sftpgo
      - fileserver_state:/var/lib/sftpgo
    networks:
      intranet:
        ipv4_address: 10.5.20.11

  metasploitable2:
    # Legacy unpatched internal server - the classic Metasploitable2 target.
    # Accessible only from inside the intranet (through the VPN).
    image: tleemcjr/metasploitable2
    container_name: cyberrange-metasploitable2
    profiles: ["intranet"]
    restart: unless-stopped
    tty: true
    networks:
      intranet:
        ipv4_address: 10.5.20.12

  # ---------------- Internal monitoring stack ----------------
  grafana:
    # Internal monitoring server - deployed with default credentials (admin/admin),
    # the classic post-pivot win. VPN or dvwa pivot only.
    # Dashboards and data sources are provisioned from ./monitoring.
    # The custom entrypoint computes the wg-easy API Authorization header
    # (Basic base64(user:password)) for datasource provisioning.
    image: grafana/grafana:12.2.10
    container_name: cyberrange-grafana
    profiles: ["intranet"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin      # explicit: the lesson is default creds
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource
      WG_ADMIN_USER: ${WG_ADMIN_USER:-admin}
      WG_ADMIN_PASSWORD: ${WG_ADMIN_PASSWORD:?Set WG_ADMIN_PASSWORD in CyberRange/.env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        export WG_EASY_BASIC="Basic $$(printf '%s:%s' "$$WG_ADMIN_USER" "$$WG_ADMIN_PASSWORD" | base64)"
        exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    networks:
      intranet:
        ipv4_address: 10.5.20.14
    depends_on:
      - prometheus

  prometheus:
    # Metrics server: scrapes the blackbox exporter health probes and grafana.
    image: prom/prometheus:latest
    container_name: cyberrange-prometheus
    profiles: ["intranet"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      intranet:
        ipv4_address: 10.5.20.15

  blackbox-exporter:
    # Health prober, like real ops monitoring that watches every zone.
    # Dual-homed (intranet + dmz) so it can probe the DMZ services - this is
    # the documented monitoring exception to the single-leg rule, and it does
    # NOT open a pivot: the dmz leg lets the prober out, nothing comes back in.
    image: prom/blackbox-exporter:latest
    container_name: cyberrange-blackbox
    profiles: ["intranet"]
    restart: unless-stopped
    networks:
      intranet:
        ipv4_address: 10.5.20.16
      dmz:
        ipv4_address: 10.5.10.20

  wks-user01:
    # User workstation 01 - Ubuntu XFCE desktop in the browser (Selkies streaming,
    # HTTPS on port 3001 with a self-signed certificate).
    <<: *webtop
    container_name: cyberrange-wks-user01
    profiles: ["intranet"]
    networks:
      intranet:
        ipv4_address: 10.5.20.21

  wks-user02:
    # User workstation 02.
    <<: *webtop
    container_name: cyberrange-wks-user02
    profiles: ["intranet"]
    networks:
      intranet:
        ipv4_address: 10.5.20.22

  # ---------------- VPN gateway ----------------
  wg-easy:
    # Corporate VPN gateway. Split-tunnel by default: peers route only
    # 10.99.0.0/24 (tunnel) and 10.5.20.0/24 (intranet), their own Internet
    # traffic stays direct. First start is pre-configured via INIT_* env vars.
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: cyberrange-wg-easy
    profiles: ["vpn"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USER:-admin}
      # Required: no default. Generate one, e.g. `openssl rand -base64 18`
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD:?Set WG_ADMIN_PASSWORD in CyberRange/.env}
      INIT_HOST: ${WG_HOST:-auto}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: 1.1.1.1
      # Group rule: INIT_IPV4_CIDR and INIT_IPV6_CIDR must be set together
      # (IPv6 itself is disabled above).
      INIT_IPV4_CIDR: ${WG_TUNNEL_CIDR:-10.99.0.0/24}
      INIT_IPV6_CIDR: fd99::/64
      INIT_ALLOWED_IPS: ${WG_TUNNEL_CIDR:-10.99.0.0/24},10.5.20.0/24
    volumes:
      - wg_easy_config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:51821:51821"   # Admin UI (create peers / QR codes)
      - "51820:51820/udp"                     # WireGuard endpoint for participants
    networks:
      intranet:
        ipv4_address: 10.5.20.2

volumes:
  dvwa_db_data:
  intranet_wiki_config:
  fileserver_data:
  fileserver_state:
  wg_easy_config:
  grafana_data:
  prometheus_data:

networks:
  dmz:
    name: cyberrange-dmz
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.10.0/24
  db-tier:
    name: cyberrange-db-tier
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.15.0/24
  intranet:
    name: cyberrange-intranet
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.20.0/24